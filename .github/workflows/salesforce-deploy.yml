name: Salesforce CI/CD Deployment

on:
  push:
    branches:
      - main
      - githubcicd

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout Code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Ensures HEAD~1 exists for git diff

      # 2️⃣ Install Salesforce CLI
      - name: Install Salesforce CLI
        run: |
          npm install @salesforce/cli --global
          sf --version

      # 3️⃣ Authenticate to Salesforce (JWT Auth)
      - name: Authenticate to Salesforce Org
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key
          sf org login jwt --username ${{ secrets.SF_USERNAME }} \
            --jwt-key-file server.key \
            --client-id ${{ secrets.SF_CONSUMER_KEY }} \
            --instance-url ${{ secrets.SF_INSTANCE_URL }} \
            --alias projectdemosfdc
          sf org display --target-org projectdemosfdc

      # 4️⃣ Identify Changed Files in Commit
      - name: Identify changed components
        id: changed
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep 'force-app' || true)" >> $GITHUB_ENV
          else
            echo "CHANGED_FILES=$(git diff --name-only HEAD | grep 'force-app' || true)" >> $GITHUB_ENV
          fi
          echo "Changed files:"
          git "$CHANGED_FILES"

      # 5️⃣ Deploy Changed Files to Target Org
      - name: Deploy to Target Org
        if: env.CHANGED_FILES != ''
        run: |
          echo "Deploying changed files..."
          sf project deploy start --source-dir force-app/main/default --target-org projectdemosfdc --ignore-warnings
          
      # 6️⃣ Post-Deployment Report
      - name: Post Deployment Summary
        if: always()
        run: |
          echo "Deployment completed successfully!"
          echo "Files deployed:"
          echo "$CHANGED_FILES"
