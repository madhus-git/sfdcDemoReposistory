name: Salesforce CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - githubcicd
      - feature/**

jobs:
  salesforce-deploy:
    name: Salesforce CI/CD
    runs-on: self-hosted
    env:
      SFDC_HOST: "https://login.salesforce.com"
      ORG_ALIAS: "projectdemosfdc"
      NEXUS_URL: "http://localhost:8081/repository/StaticCodeAnalysisReports"

    steps:
      # ======================
      # 1. Checkout Repository (Fixed fetch-depth)
      # ======================
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensures full history so git diff works properly

      # ======================
      # 2. Cache Salesforce CLI
      # ======================
      - name: Cache Salesforce CLI
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Roaming\npm
          key: ${{ runner.os }}-sfdx-cli

      # ======================
      # 3. Install Salesforce CLI & Plugins
      # ======================
      - name: Install Pre-requisites
        shell: powershell
        run: |
          Write-Host "Verifying Git installation..."
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) {
              Write-Error "Git is not installed or not in PATH."
              exit 1
          } else {
              git --version
          }

          Write-Host "Checking npm installation..."
          if (-not (Get-Command npm -ErrorAction SilentlyContinue)) {
              Write-Error "npm is not installed. Please install Node.js first."
              exit 1
          } else {
              npm --version
          }

          Write-Host "Installing or Updating Salesforce CLI..."
          if (-not (Get-Command sf -ErrorAction SilentlyContinue)) {
              npm install --global @salesforce/cli@latest
              $npmGlobalPath = (npm root -g).Replace('node_modules', '')
              echo "PATH=$npmGlobalPath;$env:PATH" >> $env:GITHUB_ENV
          } else {
              npm update --global @salesforce/cli
          }

          Write-Host "Installing or Updating Salesforce Scanner Plugin..."
          try {
              sf plugins install @salesforce/sfdx-scanner@latest
          } catch {
              Write-Warning "Scanner plugin may already exist."
          }

      # ======================
      # 4. Static Code Analysis
      # ======================
      - name: Static Code Analyzer
        id: sca
        shell: powershell
        run: |
          Write-Host "Running Static Code Analysis..."
          $dateStamp = Get-Date -Format "ddMMyy"
          $buildNumber = $env:GITHUB_RUN_NUMBER
          $htmlDir = "html-report"
          $htmlReport = "CodeAnalyzerReport_${dateStamp}_${buildNumber}.html"

          if (Test-Path $htmlDir) { Remove-Item -Recurse -Force $htmlDir }
          New-Item -ItemType Directory -Path $htmlDir | Out-Null
          sf code-analyzer run --workspace force-app --rule-selector Recommended --output-file "$htmlDir\$htmlReport"

          echo "report=$htmlReport" >> $env:GITHUB_OUTPUT

      # ======================
      # 5. Upload SCA Report to Nexus
      # ======================
      - name: Upload SCA Report to Nexus
        shell: powershell
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
        run: |
          $projectName = "SF-CICD-POC"
          $branchName  = $env:GITHUB_REF_NAME -replace '[^\w\-.]', '_'
          $buildNumber = $env:GITHUB_RUN_NUMBER
          $htmlReport = "${{ steps.sca.outputs.report }}"
          $nexusPath = "$projectName/$branchName/$buildNumber"
          $url = "$env:NEXUS_URL/$nexusPath/$htmlReport"
          $filePath = "html-report\$htmlReport"

          $base64Auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$env:NEXUS_USER`:$env:NEXUS_PASS"))
          Invoke-WebRequest -Uri $url -Method Put -InFile $filePath -Headers @{Authorization = "Basic $base64Auth"} -UseBasicParsing

      # ======================
      # 7. Verify & Write JWT Key File
      # ======================
      - name: Verify, Write, Clean & Validate JWT Key File
        shell: powershell
        env:
          SF_JWT_KEY_CONTENT: ${{ secrets.SF_JWT_KEY }}
        run: |
          $keyPath = "C:\actions-runner\_work\jwt.key"
          Write-Host "Starting JWT key setup..."

          if (-not $env:SF_JWT_KEY_CONTENT) {
              Write-Error "SF_JWT_KEY secret missing or empty."
              exit 1
          }

          if (Test-Path $keyPath) { Remove-Item -Force $keyPath }

          if ($env:SF_JWT_KEY_CONTENT -match "^[A-Za-z0-9+/=]+$" -and $env:SF_JWT_KEY_CONTENT.Length -gt 300) {
              $decoded = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($env:SF_JWT_KEY_CONTENT))
              Set-Content -Path $keyPath -Value $decoded -Encoding UTF8
          } else {
              $env:SF_JWT_KEY_CONTENT | Out-File -FilePath $keyPath -Encoding UTF8
          }

          if (-not (Test-Path $keyPath)) {
              Write-Error "JWT key creation failed."
              exit 1
          }

          echo "JWT_KEY_FILE=$keyPath" >> $env:GITHUB_ENV

      # ======================
      # 8. Authenticate Salesforce Org
      # ======================
      - name: Authenticate Salesforce Org
        shell: powershell
        env:
          CONNECTED_APP_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
          SFDC_USERNAME: ${{ secrets.SF_USERNAME }}
        run: |
          sf org login jwt `
            --client-id $env:CONNECTED_APP_CONSUMER_KEY `
            --jwt-key-file $env:JWT_KEY_FILE `
            --username $env:SFDC_USERNAME `
            --alias $env:ORG_ALIAS `
            --instance-url $env:SFDC_HOST

      # ======================
      # 9. Identify Changed Components (Updated for same-file redeploys)
      # ======================
      - name: Identify changed Salesforce metadata files
        shell: powershell
        run: |
          Write-Host 'Identifying changed Salesforce metadata files...'
          $ErrorActionPreference = 'Stop'

          $changedDeployPath = 'changed-deploy/force-app/main/default'
          if (Test-Path $changedDeployPath) { Remove-Item $changedDeployPath -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $changedDeployPath | Out-Null

          # Get changed files (compare last commit with previous one)
          $hasPrevCommit = git rev-parse 'HEAD^' 2>$null
          if ($LASTEXITCODE -eq 0) {
              $changedFiles = git diff --name-only HEAD^ HEAD | Where-Object { $_ -match '^force-app/' }
          } else {
              Write-Host 'First commit — taking all metadata files.'
              $changedFiles = git ls-files 'force-app/'
          }

          if (-not $changedFiles) {
              Write-Host 'No changes detected. Skipping deployment.'
              Add-Content -Path $env:GITHUB_ENV -Value 'CHANGED_DIR=none'
              exit 0
          }

          Write-Host 'Changed files:'
          $changedFiles | ForEach-Object { Write-Host $_ }

          foreach ($file in $changedFiles) {
            if (Test-Path $file) {
                $destPath = Join-Path 'changed-deploy' $file
                New-Item -ItemType Directory -Force -Path (Split-Path $destPath) | Out-Null
                Copy-Item $file $destPath -Force
            }
          }

          $copiedFiles = (Get-ChildItem -Recurse -File changed-deploy | Measure-Object).Count
          if ($copiedFiles -eq 0) {
              Write-Host 'No deployable files copied.'
              Add-Content -Path $env:GITHUB_ENV -Value 'CHANGED_DIR=none'
              exit 0
          }

          Write-Host "Copied $copiedFiles changed files into changed-deploy directory."
          Add-Content -Path $env:GITHUB_ENV -Value 'CHANGED_DIR=changed-deploy/force-app/main/default'        
          
      # ======================
      # 10. Preview Deployment Changes
      # ======================
      - name: Preview Deployment Changes
        if: env.CHANGED_DIR != 'none' && env.CHANGED_DIR != ''
        shell: powershell
        run: |
          Write-Host "Previewing deployment changes..."
          if (-not $env:CHANGED_DIR -or $env:CHANGED_DIR -eq 'none') {
              Write-Host "No changed directory found. Skipping preview."
              exit 0
          }

          $orgType = sf org display --target-org $env:ORG_ALIAS --json | ConvertFrom-Json
          $isScratch = $orgType.result.isScratchOrg

          if ($isScratch -eq $true) {
              Write-Host "Org supports source tracking. Running preview..."
              sf project deploy preview --source-dir "$env:CHANGED_DIR" --target-org $env:ORG_ALIAS
          } else {
              Write-Host "Org is not source-tracked (sandbox/prod). Skipping preview step."
          }    
          
      # ======================
      # 11. Deploy Changed Components
      # ======================
      - name: Deploy changed metadata to Salesforce
        if: env.CHANGED_DIR != 'none'
        shell: powershell
        run: |
          Write-Host 'Deploying changed metadata to Salesforce...'
          $ErrorActionPreference = 'Stop'

          # --- Clean CLI cache ---
          $cacheDir = Join-Path $env:USERPROFILE '.sf'
          if (Test-Path $cacheDir) {
              Write-Host 'Cleaning old Salesforce CLI cache...'
              Remove-Item -Recurse -Force "$cacheDir" -ErrorAction SilentlyContinue
          }

          # --- Refresh timestamps ---
          Write-Host 'Touching changed files to refresh timestamps...'
          Get-ChildItem -Recurse -File "$env:CHANGED_DIR" | ForEach-Object {
              (Get-Item $_.FullName).LastWriteTime = Get-Date
          }

          # --- Start deployment ---
          Write-Host 'Starting deployment...'
          $logFile = 'sf-deploy-log.txt'
          sf project deploy start --source-dir "$env:CHANGED_DIR" --target-org $env:ORG_ALIAS --ignore-conflicts --wait 10 --verbose 2>&1 | Tee-Object -FilePath $logFile
          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
              Write-Warning "Deployment exited with code $exitCode — checking if NothingToDeploy..."
              $logContent = Get-Content $logFile -Raw

              if ($logContent -match 'NothingToDeploy') {
                  Write-Host 'No deployable changes detected. Attempting forced redeploy...'

                  $tempDir = 'redeploy-temp'
                  if (Test-Path $tempDir) { Remove-Item -Recurse -Force $tempDir }
                  Copy-Item "$env:CHANGED_DIR" $tempDir -Recurse

                  Get-ChildItem -Recurse -File $tempDir | ForEach-Object {
                      (Get-Item $_.FullName).LastWriteTime = Get-Date
                  }
                  
                  sf project deploy start --source-dir $tempDir --target-org $env:ORG_ALIAS --ignore-conflicts --wait 10 --verbose
                  if ($LASTEXITCODE -eq 0) {
                      Write-Host 'Forced redeploy completed successfully.'
                  } else {
                      Write-Error 'Forced redeploy also failed. Check sf-deploy-log.txt for details.'
                      exit 1
                  }
              } else {
                  Write-Error 'Deployment failed for reasons other than NothingToDeploy.'
                  Get-Content $logFile
                  exit 1
              } else {
                  Write-Host 'Deployment completed successfully.'
              }       

      # ======================
      # 12. Run Apex Tests
      # ======================
      - name: Cleanup temporary folders
        if: always()
        shell: powershell
        run: |
          Write-Host "Cleaning up temporary directories..."
          if (Test-Path 'changed-deploy') { Remove-Item -Recurse -Force 'changed-deploy' }
          if (Test-Path 'redeploy-temp') { Remove-Item -Recurse -Force 'redeploy-temp' }

      # ======================
      # 13. Run Apex Tests
      # ======================
      - name: Run Apex Unit Tests
        if: env.CHANGED_DIR != 'none'
        shell: powershell
        run: |
          Write-Host "Running Apex Unit Tests..."
          New-Item -ItemType Directory -Path "test-results" -Force | Out-Null
          sf apex run test --target-org $env:ORG_ALIAS --result-format junit --output-dir test-results --wait 10

      - name: Publish Apex Test Results
        if: env.CHANGED_DIR != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: Apex-Test-Results
          path: test-results/**/*.xml

      # ======================
      # 14. Cleanup Workspace
      # ======================
      - name: Cleanup Workspace
        shell: powershell
        run: |
          Write-Host "Cleaning workspace..."
          $keyPath = "C:\actions-runner\_work\jwt.key"
          if (Test-Path $keyPath) { Remove-Item -Force $keyPath }