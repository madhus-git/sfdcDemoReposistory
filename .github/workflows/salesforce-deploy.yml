name: Salesforce CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - githubcicd
      - feature/**

jobs:
  salesforce-deploy:
    name: Salesforce CI/CD
    runs-on: self-hosted  # Windows self-hosted runner
    env:
      SFDC_HOST: "https://login.salesforce.com"
      ORG_ALIAS: "projectdemosfdc"
      NEXUS_URL: "http://localhost:8081/repository/StaticCodeAnalysisReports"

    steps:
      # ======================
      # 1. Checkout Repository
      # ======================
      - name: Checkout Source
        uses: actions/checkout@v4

      # ======================
      # 2. Cache Salesforce CLI
      # ======================
      - name: Cache Salesforce CLI
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Roaming\npm
          key: ${{ runner.os }}-sfdx-cli

      # ======================
      # 3. Install Salesforce CLI & Plugins
      # ======================
      - name: Install Salesforce CLI and Scanner
        shell: powershell
        run: |
          Write-Host "Installing Salesforce CLI and Scanner Plugin..."
          if (-not (Get-Command npm -ErrorAction SilentlyContinue)) {
              Write-Error "npm is not installed or not in PATH. Please install Node.js on this runner."
              exit 1
          }

          if (-not (Get-Command sf -ErrorAction SilentlyContinue)) {
              Write-Host "Salesforce CLI not found. Installing..."
              npm install --global @salesforce/cli@latest
              $npmGlobalPath = (npm root -g).Replace('node_modules', '')
              Write-Host "Adding npm global path to PATH: $npmGlobalPath"
              echo "PATH=$npmGlobalPath;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

          Write-Host "Installing or updating Salesforce Scanner plugin..."
          try { sf plugins install @salesforce/sfdx-scanner@latest } catch { Write-Host "Plugin already installed" }
          try { sf plugins update } catch { Write-Host "Plugin update skipped" }

      # ======================
      # 4. Static Code Analysis
      # ======================
      - name: Run Salesforce Code Analyzer
        id: sca
        shell: powershell
        run: |
          Write-Host "Running Static Code Analysis..."
          $dateStamp = Get-Date -Format "ddMMyy"
          $buildNumber = $env:GITHUB_RUN_NUMBER
          $htmlDir = "html-report"
          $htmlReport = "CodeAnalyzerReport_${dateStamp}_${buildNumber}.html"
          if (Test-Path $htmlDir) { Remove-Item -Recurse -Force $htmlDir }
          New-Item -ItemType Directory -Path $htmlDir | Out-Null

          sf code-analyzer run --workspace force-app --rule-selector Recommended --output-file "$htmlDir\$htmlReport"
          echo "report=$htmlReport" >> $env:GITHUB_OUTPUT

      # ======================
      # 5. Upload SCA Report to Nexus
      # ======================
      - name: Upload SCA Report to Nexus
        shell: powershell
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
        run: |
          $projectName = "SF-CICD-POC"
          $branchName  = $env:GITHUB_REF_NAME -replace '[^\w\-.]', '_'
          $dateStamp = Get-Date -Format "ddMMyy"
          $buildNumber = $env:GITHUB_RUN_NUMBER
          $htmlReport = "${{ steps.sca.outputs.report }}"
          $nexusPath = "$projectName/$branchName/$buildNumber"
          $url = "$env:NEXUS_URL/$nexusPath/$htmlReport"
          $filePath = "html-report\$htmlReport"
          $maxRetries = 3
          $delay = 5
          $attempt = 1
          $success = $false
          $base64Auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$env:NEXUS_USER`:$env:NEXUS_PASS"))

          while (-not $success -and $attempt -le $maxRetries) {
              Write-Host "Attempt ${attempt} of ${maxRetries}: Uploading ${htmlReport} ..."
              try {
                  $response = Invoke-WebRequest -Uri $url -Method Put -InFile $filePath -Headers @{Authorization = "Basic $base64Auth"} -UseBasicParsing
                  if ($response.StatusCode -eq 201 -or $response.StatusCode -eq 200) {
                      Write-Host "✅ Successfully uploaded report to Nexus at ${url}"
                      $success = $true
                  } else {
                      Write-Warning "Upload failed with HTTP code: $($response.StatusCode)"
                      if ($attempt -lt $maxRetries) { Start-Sleep -Seconds $delay; $delay *= 2 }
                  }
              } catch {
                  Write-Warning "Error during upload: $($_.Exception.Message)"
                  if ($attempt -lt $maxRetries) { Start-Sleep -Seconds $delay; $delay *= 2 }
              }
              $attempt++
          }

          if (-not $success) { Write-Error "❌ Failed to upload report to Nexus after ${maxRetries} attempts."; exit 1 }

      # ======================
      # 6. Pre-Check Salesforce Credentials (Fix JWT)
      # ======================
      - name: Pre-Check Salesforce Credentials
        id: precheck
        shell: powershell
        env:
          CONNECTED_APP_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
          SFDC_USERNAME: ${{ secrets.SF_USERNAME }}
          JWT_KEY_CONTENT: ${{ secrets.SF_JWT_KEY }}   # raw multi-line key
        run: |
          Write-Host "Validating Salesforce Credentials..."
          if (-not $env:CONNECTED_APP_CONSUMER_KEY) { Write-Error "Missing CONNECTED_APP_CONSUMER_KEY"; exit 1 }
          if (-not $env:SFDC_USERNAME) { Write-Error "Missing SFDC_USERNAME"; exit 1 }
          if (-not $env:JWT_KEY_CONTENT) { Write-Error "Missing JWT key content"; exit 1 }

          # Write JWT key to temporary file
          $jwtFile = Join-Path $env:GITHUB_WORKSPACE "jwt-key.pem"
          $env:JWT_KEY_FILE = $jwtFile
          $env:JWT_KEY_CONTENT -split "`n" | ForEach-Object { $_.Trim() } | Set-Content -Path $jwtFile -NoNewline
          Write-Host "✅ JWT key file created at $jwtFile"
          echo "JWT_KEY_FILE=$jwtFile" >> $env:GITHUB_ENV

      # ======================
      # 7. Authenticate Salesforce Org
      # ======================
      - name: Authenticate Salesforce Org
        shell: powershell
        env:
          CONNECTED_APP_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
          SFDC_USERNAME: ${{ secrets.SF_USERNAME }}
          JWT_KEY_FILE: ${{ env.JWT_KEY_FILE }}
        run: |
          Write-Host "Authenticating to Salesforce Org..."
          sf org login jwt `
            --client-id $env:CONNECTED_APP_CONSUMER_KEY `
            --jwt-key-file $env:JWT_KEY_FILE `
            --username $env:SFDC_USERNAME `
            --alias $env:ORG_ALIAS `
            --instance-url $env:SFDC_HOST

      # ======================
      # 8. Identify Changed Components
      # ======================
      - name: Identify Changed Components
        shell: powershell
        run: |
          Write-Host "Identifying changed Salesforce components..."
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) {
              Write-Error "git is not installed or not in PATH."
              exit 1
          }

          git fetch origin $env:GITHUB_REF_NAME
          $changedFiles = git diff --name-only origin/main...HEAD
          $changedComponents = @()
          foreach ($file in $changedFiles) {
              if ($file -like "force-app/**") { $changedComponents += $file }
          }
          Write-Host "Changed components:`n$($changedComponents -join "`n")"
          echo "CHANGED_COMPONENTS=$($changedComponents -join ',')" >> $env:GITHUB_ENV

      # ======================
      # 9. Deploy Changed Components
      # ======================
      - name: Deploy Changed Components
        shell: powershell
        run: |
          if (-not $env:CHANGED_COMPONENTS) {
              Write-Host "No changes detected. Skipping deployment."
          } else {
              Write-Host "Deploying changed components..."
              $tempDir = "deploy-changed"
              if (Test-Path $tempDir) { Remove-Item -Recurse -Force $tempDir }
              New-Item -ItemType Directory -Path $tempDir | Out-Null

              foreach ($file in $env:CHANGED_COMPONENTS -s_
