name: Salesforce CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - githubcicd
      - feature/**

jobs:
  salesforce-deploy:
    name: Salesforce CI/CD
    runs-on: self-hosted  # Windows self-hosted runner

    env:
      SFDC_HOST: "https://login.salesforce.com"
      ORG_ALIAS: "projectdemosfdc"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Step 1: Verify Git & npm
      # ---------------------------------------------------------
      - name: Verify Git and npm installation
        shell: powershell
        run: |
          Write-Host "Verifying Git installation..."
          git --version
          Write-Host "Checking npm installation..."
          npm --version

      # ---------------------------------------------------------
      # Step 2: Install Salesforce CLI (NetworkService compatible)
      # ---------------------------------------------------------
      - name: Install or Update Salesforce CLI (NetworkService compatible)
        shell: powershell
        run: |
          Write-Host "Installing Salesforce CLI for NetworkService user..."

          # Create writable npm global directory
          $npmGlobal = "C:\actions-runner\_work\npm-global"
          if (!(Test-Path $npmGlobal)) {
            New-Item -ItemType Directory -Path $npmGlobal | Out-Null
          }

          # Configure npm to use this prefix
          npm config set prefix $npmGlobal

          # Install Salesforce CLI
          npm install -g @salesforce/cli

          # Add CLI path to PATH for both session and workflow
          $sfBinPath = "$npmGlobal\node_modules\.bin"
          Write-Host "Adding $sfBinPath to PATH..."
          $env:Path = "$sfBinPath;$env:Path"
          echo "$sfBinPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          # Refresh PowerShell session (important for NetworkService)
          Write-Host "Refreshing PowerShell session environment..."
          [Environment]::SetEnvironmentVariable('Path', $env:Path, 'Process')

          # Verify CLI installation
          Write-Host "Verifying Salesforce CLI installation..."
          Get-Command sf -ErrorAction SilentlyContinue
          if (-not (Get-Command sf -ErrorAction SilentlyContinue)) {
              Write-Error "Salesforce CLI (sf) not found in PATH. Aborting."
              Get-ChildItem $sfBinPath
              exit 1
          }

          sf --version
          sf plugins list

      # ---------------------------------------------------------
      # Step 3: Install Required Salesforce Plugins
      # ---------------------------------------------------------
      - name: Install Salesforce Plugins
        shell: powershell
        run: |
          Write-Host "Installing required Salesforce plugins..."
          sf plugins install @salesforce/sfdx-scanner || Write-Host "⚠️ Scanner plugin may already exist."
          sf plugins install @salesforce/code-analyzer || Write-Host "⚠️ Code Analyzer plugin may already exist."
          sf plugins list

      # ---------------------------------------------------------
      # 🧩 Step 4: Run Static Code Analysis
      # ---------------------------------------------------------
      - name: Run Static Code Analysis
        shell: powershell
        run: |
          Write-Host "Running Static Code Analysis..."
          sf code-analyzer run --workspace force-app --rule-selector Recommended --format table

      # ---------------------------------------------------------
      # 🧩 Step 5: Deploy only changed metadata to Salesforce
      # ---------------------------------------------------------
      - name: Deploy changed metadata to Salesforce
        shell: powershell
        run: |
          Write-Host "🚀 Detecting changed files..."
          $CHANGED_FILES = git diff --name-only HEAD^ HEAD | Where-Object { $_ -match 'force-app' }

          if (-not $CHANGED_FILES) {
            Write-Host "✅ No changed metadata found. Skipping deployment."
            exit 0
          }

          Write-Host "🚀 Deploying only changed components..."
          foreach ($file in $CHANGED_FILES) {
            Write-Host "Deploying: $file"
            sf project deploy start --source-dir "$file" --target-org $env:ORG_ALIAS --ignore-warnings --ignore-errors || Write-Host "⚠️ Deployment warning ignored."
          }

      # ---------------------------------------------------------
      # 🧩 Step 6: Post-deployment verification
      # ---------------------------------------------------------
      - name: Verify deployment success
        shell: powershell
        run: |
          Write-Host "Verifying deployment status..."
          sf project deploy report
