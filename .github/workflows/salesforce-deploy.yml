name: Salesforce CI/CD Deployment

on:
  push:
    branches:
      - main
      - githubcicd

jobs:
  deploy:
    runs-on: self-hosted
    
    env:
      ORG_ALIAS: projectdemosfdc
      HTML_DIR: html-report
      PROJECT_NAME: SF-CICD-POC
      BUILD_NUMBER: ${{ github.run_number }}
      DATE_STAMP: ${{ github.run_id }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_USER: ${{ secrets.NEXUS_USER }}
      NEXUS_PASS: ${{ secrets.NEXUS_PASS }}

    steps:
      # 1️⃣ Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 2️⃣ Verify Salesforce CLI + SFDX Scanner Plugin (Windows)
      - name: Verify Salesforce CLI + SFDX Scanner Plugin (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "Checking Salesforce CLI..."
          if (-not (Get-Command sf -ErrorAction SilentlyContinue)) {
            Write-Host "❌ Salesforce CLI not found. Please install it manually on the runner."
            exit 1
          } else {
            Write-Host "✅ Salesforce CLI is installed"
          }

          Write-Host "Checking SFDX Scanner plugin..."
          $pluginList = sf plugins list
          if ($pluginList -notmatch "sfdx-scanner") {
            Write-Host "Installing SFDX Scanner plugin..."
            sf plugins install @salesforce/sfdx-scanner@3.16.0 -f
          } else {
            Write-Host "Updating SFDX Scanner plugin..."
            sf plugins update @salesforce/sfdx-scanner
          }

          sf --version
          sf plugins list

      # 3️⃣ Verify Salesforce CLI + SFDX Scanner Plugin (Linux/macOS)
      - name: Verify Salesforce CLI + SFDX Scanner Plugin (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          if ! command -v sf >/dev/null 2>&1; then
            echo "❌ Salesforce CLI not found. Please install it."
            exit 1
          fi

          if ! sf plugins list | grep -q 'sfdx-scanner'; then
            echo "Installing SFDX Scanner plugin..."
            sf plugins install @salesforce/sfdx-scanner@3.16.0
          else
            echo "Updating SFDX Scanner plugin..."
            sf plugins update @salesforce/sfdx-scanner
          fi

          sf --version
          sf plugins list

      