name: Salesforce CI/CD Deployment

on:
  push:
    branches:
      - main
      - githubcicd

jobs:
  deploy:
    runs-on: self-hosted
    
    env:
      ORG_ALIAS: projectdemosfdc
      HTML_DIR: html-report
      PROJECT_NAME: SF-CICD-POC
      BUILD_NUMBER: ${{ github.run_number }}
      DATE_STAMP: ${{ github.run_id }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_USER: ${{ secrets.NEXUS_USER }}
      NEXUS_PASS: ${{ secrets.NEXUS_PASS }}

    steps:
      # 1️⃣ Checkout Code (cross-platform, works for Windows too )
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 2️⃣ Install Salesforce CLI + SFDX Scanner Plugin (Windows)
      - name: Install Salesforce CLI + SFDX Scanner Plugin (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "Installing Salesforce CLI..."
          npm install --global @salesforce/cli@2.61.8

          # Add npm global path to current session          
          $env:PATH += ";" + (npm config get prefix) + "\node_modules\@salesforce\cli\bin"

          Write-Host "Installing/updating SFDX Scanner plugin..."
          try {
            sf plugins install @salesforce/sfdx-scanner@3.16.0 -f
          } catch {
            Write-Host "Plugin already installed, updating..."
            sf plugins update @salesforce/sfdx-scanner
          }

          sf --version
          sf plugins list

      
