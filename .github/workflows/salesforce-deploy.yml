name: Salesforce CI/CD Deployment

on:
  push:
    branches:
      - main
      - githubcicd

jobs:
  deploy:
    runs-on: self-hosted
    
    env:
      ORG_ALIAS: projectdemosfdc
      HTML_DIR: html-report
      PROJECT_NAME: SF-CICD-POC
      BUILD_NUMBER: ${{ github.run_number }}
      DATE_STAMP: ${{ github.run_id }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_USER: ${{ secrets.NEXUS_USER }}
      NEXUS_PASS: ${{ secrets.NEXUS_PASS }}

    steps:
      # 1️⃣ Checkout Code (cross-platform)
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 2️⃣ Install Salesforce CLI + SFDX Scanner Plugin (Windows)
      - name: Install Salesforce CLI + SFDX Scanner Plugin (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "Downloading Salesforce CLI installer..."
          Invoke-WebRequest -Uri https://developer.salesforce.com/media/salesforce-cli/sfdx-windows-x64.exe -OutFile sfdx-cli.exe

          Write-Host "Installing Salesforce CLI silently..."
          Start-Process sfdx-cli.exe -ArgumentList "/S" -Wait

          Write-Host "Verifying Salesforce CLI installation..."
          sf --version

          Write-Host "Installing/updating SFDX Scanner plugin..."
          try {
            sf plugins install @salesforce/sfdx-scanner@3.16.0 -f
          } catch {
            Write-Host "Plugin already installed, updating..."
            sf plugins update @salesforce/sfdx-scanner
          }

          sf plugins list

      # 3️⃣ Install Salesforce CLI + SFDX Scanner Plugin (Linux/macOS)
      - name: Install Salesforce CLI + SFDX Scanner Plugin (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "Installing Salesforce CLI and SFDX Scanner Plugin..."
          set -e

          if ! command -v sf >/dev/null 2>&1; then
            echo "Installing Salesforce CLI..."
            npm install --global @salesforce/cli@2.61.8
          else
            echo "Salesforce CLI already installed"
          fi

          if ! sf plugins list | grep -q 'sfdx-scanner'; then
            echo "Installing SFDX Scanner plugin..."
            sf plugins install @salesforce/sfdx-scanner@3.16.0
          else
            echo "Updating SFDX Scanner plugin..."
            sf plugins update @salesforce/sfdx-scanner
          fi

          sf --version
          sf plugins list

     