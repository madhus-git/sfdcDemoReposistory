name: Salesforce CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - githubcicd
      - feature/**

jobs:
  salesforce-deploy:
    name: Salesforce CI/CD
    runs-on: self-hosted  # Windows self-hosted runner
    env:
      SFDC_HOST: "https://login.salesforce.com"
      ORG_ALIAS: "projectdemosfdc"
      NEXUS_URL: "http://localhost:8081/repository/StaticCodeAnalysisReports"

    steps:
      # ======================
      # 1. Checkout Repository
      # ======================
      - name: Checkout Source
        uses: actions/checkout@v4

      # ======================
      # 2. Cache Salesforce CLI
      # ======================
      - name: Cache Salesforce CLI
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Roaming\npm
          key: ${{ runner.os }}-sfdx-cli

      # ======================
      # 3. Install Salesforce CLI & Plugins
      # ======================
      - name: Install Pre-requisites
        shell: powershell
        run: |
          Write-Host "Verifying Git installation..."
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) {
              Write-Error "Git is not installed or not in PATH. Please install Git manually on this runner."
              exit 1
          } else {
              Write-Host "Git is installed and available in PATH."
              git --version
          }

          Write-Host "Checking npm installation..."
          if (-not (Get-Command npm -ErrorAction SilentlyContinue)) {
              Write-Error "npm is not installed. Please install Node.js before continuing."
              exit 1
          } else {
              Write-Host "npm is installed. Version:"
              npm --version
          }

          Write-Host "Installing or Updating Salesforce CLI..."
          if (-not (Get-Command sf -ErrorAction SilentlyContinue)) {
              npm install --global @salesforce/cli@latest
              $npmGlobalPath = (npm root -g).Replace('node_modules', '')
              echo "PATH=$npmGlobalPath;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              Write-Host "Salesforce CLI installed successfully."
          } else {
              Write-Host "Salesforce CLI already present. Updating to latest..."
              npm update --global @salesforce/cli
          }

          Write-Host "Installing or Updating Salesforce Scanner Plugin..."
          try{
              sf plugins install @salesforce/sfdx-scanner@latest
              Write-Host "Scanner plugin installed or updated."
          } catch {
              Write-Warning "Scanner plugin may already exist, continuing..."
          }
          Write-Host "Salesforce CLI setup completed successfully."           
          
      # ======================
      # 4. Static Code Analysis
      # ======================
      - name: Static Code Analyzer
        id: sca
        shell: powershell
        run: |
          Write-Host "Running Static Code Analysis..."
          $dateStamp = Get-Date -Format "ddMMyy"
          $buildNumber = $env:GITHUB_RUN_NUMBER
          $htmlDir = "html-report"
          $htmlReport = "CodeAnalyzerReport_${dateStamp}_${buildNumber}.html"
          if (Test-Path $htmlDir) { Remove-Item -Recurse -Force $htmlDir }
          New-Item -ItemType Directory -Path $htmlDir | Out-Null
          sf code-analyzer run --workspace force-app --rule-selector Recommended --output-file "$htmlDir\$htmlReport"
          echo "report=$htmlReport" >> $env:GITHUB_OUTPUT

      # ======================
      # 5. Upload SCA Report to Nexus
      # ======================
      - name: Upload SCA Report to Artifactory
        shell: powershell
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
        run: |
          $projectName = "SF-CICD-POC"
          $branchName  = $env:GITHUB_REF_NAME -replace '[^\w\-.]', '_'
          $buildNumber = $env:GITHUB_RUN_NUMBER
          $htmlReport = "${{ steps.sca.outputs.report }}"
          $nexusPath = "$projectName/$branchName/$buildNumber"
          $url = "$env:NEXUS_URL/$nexusPath/$htmlReport"
          $filePath = "html-report\$htmlReport"
          $base64Auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$env:NEXUS_USER`:$env:NEXUS_PASS"))
          Invoke-WebRequest -Uri $url -Method Put -InFile $filePath -Headers @{Authorization = "Basic $base64Auth"} -UseBasicParsing
          Write-Host "Uploaded report to Nexus at ${url}"

      # ======================
      # 7. Verify, Write, Clean & Validate JWT Key File
      # ======================
      - name: Verify, Write, Clean & Validate JWT Key File
        shell: powershell
        env:
          SF_JWT_KEY_CONTENT: ${{ secrets.SF_JWT_KEY }}
        run: |
          $keyPath = "C:\actions-runner\_work\jwt.key"
          Write-Host "Starting JWT key verification and setup..."

          # Step 1: Verify secret availability
          if (-not $env:SF_JWT_KEY_CONTENT -or [string]::IsNullOrWhiteSpace($env:SF_JWT_KEY_CONTENT)) {
              Write-Error "SF_JWT_KEY secret is missing or empty. Please check your GitHub repository secrets."
              Write-Host "Go to: Repo → Settings → Secrets and variables → Actions → SF_JWT_KEY"
              exit 1
          }

          Write-Host "SF_JWT_KEY secret detected successfully. Length: $($env:SF_JWT_KEY_CONTENT.Length)"

          # Step 2: Clean up any old JWT key file
          if (Test-Path $keyPath) {
              Write-Host "Old JWT key file found at $keyPath. Removing it..."
              try {
                  Remove-Item -Path $keyPath -Force -ErrorAction Stop
                  Write-Host "Old JWT key file removed successfully."
              } catch {
                  Write-Warning "Could not remove old jwt.key file. Continuing with overwrite..."
              }
          }        
    
          # Step 3: Write key to file (handle Base64 or plain PEM)
          Write-Host "Creating JWT key file at $keyPath..."

          if ($env:SF_JWT_KEY_CONTENT -match "^[A-Za-z0-9+/=]+$" -and $env:SF_JWT_KEY_CONTENT.Length -gt 300) {
              Write-Host "Detected Base64 encoded private key. Decoding..."
              try {
                  $decoded = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($env:SF_JWT_KEY_CONTENT))
                  Set-Content -Path $keyPath -Value $decoded -Encoding UTF8
              } catch {
                  Write-Error "Base64 decode failed. Ensure SF_JWT_KEY is correctly encoded."
                  exit 1
              }
          } else {
              Write-Host "Detected plain-text PEM key. Writing as-is..."
              $env:SF_JWT_KEY_CONTENT | Out-File -FilePath $keyPath -Encoding UTF8
          }

          # Step 4: Validate file creation
          if (-not (Test-Path $keyPath)) {
              Write-Error "JWT key file creation failed at $keyPath"
              exit 1
          }

          Write-Host "JWT key file validated successfully and ready for authentication."
          echo "JWT_KEY_FILE=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append    

      # ======================
      # 8. Authenticate Salesforce Org
      # ======================
      - name: Authenticate Salesforce Org
        shell: powershell
        env:
          CONNECTED_APP_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
          SFDC_USERNAME: ${{ secrets.SF_USERNAME }}
        run: |
          Write-Host "Authenticating to Salesforce Org..."
          sf org login jwt `
            --client-id $env:CONNECTED_APP_CONSUMER_KEY `
            --jwt-key-file $env:JWT_KEY_FILE `
            --username $env:SFDC_USERNAME `
            --alias $env:ORG_ALIAS `
            --instance-url $env:SFDC_HOST

      # ======================
      # 9. Identify Changed Components
      # ======================
      - name: Identify changed Salesforce components
        shell: powershell
        run: |
          Write-Host "Identifying changed Salesforce components..."
          git fetch origin main
          $changedFiles = git diff --name-only origin/main...HEAD
          if (-not $changedFiles) { Write-Host "No changes detected."; echo "CHANGED_DIR=none" >> $env:GITHUB_ENV; exit 0 }
          $metadataFiles = $changedFiles | Where-Object { $_ -like "force-app/*" }
          if (-not $metadataFiles) { Write-Host "No Salesforce metadata changes."; echo "CHANGED_DIR=none" >> $env:GITHUB_ENV; exit 0 }

          $tempDeployDir = "changed-deploy"
          if (Test-Path $tempDeployDir) { Remove-Item -Recurse -Force $tempDeployDir }
          New-Item -ItemType Directory -Path $tempDeployDir | Out-Null
          foreach ($file in $metadataFiles) {
              $dest = Join-Path $tempDeployDir $file
              $destDir = Split-Path $dest
              if (-not (Test-Path $destDir)) { New-Item -ItemType Directory -Path $destDir | Out-Null }
              Copy-Item $file $dest
          }
          Write-Host "Changed components copied to $tempDeployDir"
          echo "CHANGED_DIR=$tempDeployDir" >> $env:GITHUB_ENV

      # ======================
      # 10. Deploy Changed Components
      # ======================
      - name: Deploy changed Salesforce components
        if: env.CHANGED_DIR != 'none'
        shell: powershell
        run: |
          Write-Host "Deploying only changed components..."
          sf project deploy start --target-org $env:ORG_ALIAS --source-dir $env:CHANGED_DIR --wait 10

      # ======================
      # 11. Run Apex Tests
      # ======================
      - name: Run Apex Unit Tests
        if: env.CHANGED_DIR != 'none'
        shell: powershell
        run: |
          Write-Host "Running Apex Unit Tests..."
          New-Item -ItemType Directory -Path "test-results" -Force | Out-Null
          sf apex run test --target-org $env:ORG_ALIAS --result-format junit --output-dir test-results --wait 10

      - name: Publish Apex Test Results
        if: env.CHANGED_DIR != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: Apex-Test-Results
          path: test-results/**/*.xml

      # ======================
      # 12. Cleanup
      # ======================
      - name: Cleanup Workspace
        shell: powershell
        run: |
          Write-Host "Starting workspace cleanup..."
          $keyPath = "C:\actions-runner\_work\jwt.key"

          # Step 1: Check if JWT key exists
          if (Test-Path $keyPath) {
              Write-Host "JWT key file found at $keyPath. Removing..."
              try {
                  Remove-Item -Path $keyPath -Force -ErrorAction Stop
                  Write-Host "JWT key file removed successfully."
              } catch {
                  Write-Warning "Could not delete JWT key file: $($_.Exception.Message)"
              }
          } else {
              Write-Host "No JWT key file found. Skipping key cleanup."
          }

          # Step 2: Clean the rest of workspace (optional)
          Write-Host "Cleaning temporary files and workspace folders..."
          try {
              Remove-Item -Recurse -Force -Path $env:GITHUB_WORKSPACE\* -ErrorAction SilentlyContinue
              Write-Host "Workspace cleanup completed."
          } catch {
              Write-Warning "Could not clean some workspace files: $($_.Exception.Message)"
          }
          Write-Host "Cleanup step completed successfully."