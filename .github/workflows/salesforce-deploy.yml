name: Salesforce CI/CD Deployment

on:
  push:
    branches:
      - main
      - githubcicd

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout Code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Ensures HEAD~1 exists for git diff

      # 2️⃣ Install Salesforce CLI
      - name: Install Salesforce CLI
        run: |
          npm install @salesforce/cli --global
          sf --version

      # 3️⃣ Authenticate to Salesforce (JWT Auth)
      - name: Authenticate to Salesforce Org
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key
          sf org login jwt --username ${{ secrets.SF_USERNAME }} \
            --jwt-key-file server.key \
            --client-id ${{ secrets.SF_CONSUMER_KEY }} \
            --instance-url ${{ secrets.SF_INSTANCE_URL }} \
            --alias projectdemosfdc
          sf org display --target-org projectdemosfdc

      # 4️⃣ Identify Changed Files in Commit (Fixed Logic)
      - name: Identify changed components
        id: changed
        run: |
          echo "🔍 Detecting changed Salesforce components..."
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep 'force-app' || true)
          else
            CHANGED_FILES=$(git diff --name-only HEAD | grep 'force-app' || true)
          fi

          # Remove newlines and spaces
          CHANGED_FILES=$(echo "$CHANGED_FILES" | tr '\n' ' ' | xargs)
          echo "CHANGED_FILES=$CHANGED_FILES" >> $GITHUB_ENV

          echo "Changed files detected:"
          echo "$CHANGED_FILES"

          if [ -z "$CHANGED_FILES" ]; then
            echo "⚠️ No Salesforce files changed in this commit."
          fi

      # 5️⃣ Deploy Only Changed Files to Target Org
      - name: Deploy changed components to Target Org
        if: env.CHANGED_FILES != ''
        run: |
          echo "🚀 Deploying only changed components..."
          for file in $CHANGED_FILES; do
            echo "Deploying: $file"
            sf project deploy start --source-dir "$file" --target-org projectdemosfdc --ignore-warnings --ignore-errors || true
          done

      # 6️⃣ Post-Deployment Summary
      - name: Post Deployment Summary
        if: always()
        run: |
          echo "✅ Deployment completed."
          echo "Files deployed:"
          echo "$CHANGED_FILES"
