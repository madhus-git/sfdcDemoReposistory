name: Salesforce CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - githubcicd
      
jobs:
  salesforce-deploy:
    name: Salesforce CI/CD
    runs-on: self-hosted  # Windows self-hosted runner
    env:
      SFDC_HOST: "https://login.salesforce.com"
      ORG_ALIAS: "projectdemosfdc"
      NEXUS_URL: "http://localhost:8081/repository/StaticCodeAnalysisReports"

    steps:
      # ======================
      # 1. Checkout Repository
      # ======================
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for git diff to work

      # ======================
      # 2. Install Salesforce CLI (if missing)
      # ======================
      - name: Install Salesforce CLI
        shell: powershell
        run: |
          Write-Host "Checking Salesforce CLI installation..."
          if (-not (Get-Command sf -ErrorAction SilentlyContinue)) {
              npm install --global @salesforce/cli@latest
              $npmGlobalPath = (npm root -g).Replace('node_modules', '')
              echo "PATH=$npmGlobalPath;$env:PATH" >> $env:GITHUB_ENV
          } else {
              Write-Host "Salesforce CLI already installed."
              sf --version
          }

      # ======================
      # 3. Authenticate Salesforce Org (JWT)
      # ======================
      - name: Authenticate Salesforce Org
        shell: powershell
        env:
          SF_JWT_KEY_CONTENT: ${{ secrets.SF_JWT_KEY }}
          CONNECTED_APP_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
          SFDC_USERNAME: ${{ secrets.SF_USERNAME }}
        run: |
          $keyPath = "C:\actions-runner\_work\jwt.key"
          if (Test-Path $keyPath) { Remove-Item -Force $keyPath }

          if (-not $env:SF_JWT_KEY_CONTENT) {
              Write-Error "Missing JWT key secret (SF_JWT_KEY)."
              exit 1
          }

          $decoded = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:SF_JWT_KEY_CONTENT))
          Set-Content -Path $keyPath -Value $decoded -Encoding UTF8
          echo "JWT_KEY_FILE=$keyPath" >> $env:GITHUB_ENV

          sf org login jwt `
            --client-id $env:CONNECTED_APP_CONSUMER_KEY `
            --jwt-key-file $keyPath `
            --username $env:SFDC_USERNAME `
            --alias $env:ORG_ALIAS `
            --instance-url $env:SFDC_HOST

      # ======================
      # 4. Detect Changed Metadata Files
      # ======================
      - name: Detect Changed Metadata
        id: detect_changes
        shell: powershell
        run: |
          Write-Host "Detecting changed Salesforce metadata files..."
          $ErrorActionPreference = "Stop"

          $changedDir = "changed-deploy/force-app"
          if (Test-Path $changedDir) { Remove-Item -Recurse -Force $changedDir }
          New-Item -ItemType Directory -Path $changedDir | Out-Null

          # Compare with previous commit (if exists)
          $hasPrevCommit = git rev-parse "HEAD^" 2>$null
          if ($LASTEXITCODE -eq 0) {
              $changedFiles = git diff --name-only HEAD^ HEAD | Where-Object { $_ -match '^force-app/' }
          } else {
              Write-Host "No previous commit found. Full deployment will run."
              $changedFiles = git ls-files "force-app/"
          }

          if (-not $changedFiles) {
              Write-Host "No changed files found. Skipping deployment."
              echo "CHANGED=false" >> $env:GITHUB_ENV
              exit 0
          }

          Write-Host "Changed files detected:"
          $changedFiles | ForEach-Object { Write-Host " - $_" }

          foreach ($file in $changedFiles) {
              $dest = Join-Path "changed-deploy" $file
              New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
              Copy-Item $file $dest -Force
          }

          echo "CHANGED=true" >> $env:GITHUB_ENV
          echo "CHANGED_DIR=$changedDir" >> $env:GITHUB_ENV

      # ======================
      # 5. Preview Changes (if changed)
      # ======================
      - name: Preview Deployment
        if: env.CHANGED == 'true'
        shell: powershell
        run: |
          Write-Host "Previewing changes before deployment..."
          sf project deploy preview --source-dir $env:CHANGED_DIR --target-org $env:ORG_ALIAS --ignore-conflicts

      # ======================
      # 6. Deploy Changed Components (if changed)
      # ======================
      - name: Deploy Changed Metadata
        if: env.CHANGED == 'true'
        shell: powershell
        run: |
          Write-Host "Deploying changed Salesforce metadata..."
          sf project deploy start `
            --source-dir $env:CHANGED_DIR `
            --target-org $env:ORG_ALIAS `
            --ignore-warnings `
            --ignore-errors `
            --wait 10

      # ======================
      # 7. Run Apex Tests (if changed)
      # ======================
      - name: Run Apex Tests
        if: env.CHANGED == 'true'
        shell: powershell
        run: |
          Write-Host "Running Apex Unit Tests..."
          sf apex run test --target-org $env:ORG_ALIAS --result-format junit --output-dir test-results --wait 10

      - name: Publish Apex Test Results
        if: env.CHANGED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Apex-Test-Results
          path: test-results/**/*.xml

      # ======================
      # 8. Cleanup
      # ======================
      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          Write-Host "Cleaning up temporary files..."
          if (Test-Path 'changed-deploy') { Remove-Item -Recurse -Force 'changed-deploy' }
          if (Test-Path 'C:\actions-runner\_work\jwt.key') { Remove-Item -Force 'C:\actions-runner\_work\jwt.key' }
