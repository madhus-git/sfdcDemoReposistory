name: Salesforce CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - githubcicd
      - feature/**

jobs:
  salesforce-deploy:
    name: Salesforce CI/CD
    runs-on: self-hosted
    env:
      SFDC_HOST: "https://login.salesforce.com"
      ORG_ALIAS: "projectdemosfdc"
      NEXUS_URL: "http://localhost:8081/repository/StaticCodeAnalysisReports"

    steps:
      # ======================
      # 1. Checkout Repository (Full Depth)
      # ======================
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================
      # 2. Install Salesforce CLI & Scanner
      # ======================
      - name: Install Salesforce CLI and Plugins
        shell: powershell
        run: |
          Write-Host "Installing Salesforce CLI..."
          if (-not (Get-Command sf -ErrorAction SilentlyContinue)) {
            npm install --global @salesforce/cli@latest
          } else {
            sf update
          }
          Write-Host "Installing Scanner Plugin..."
          sf plugins install @salesforce/sfdx-scanner@latest

      # ======================
      # 3. Authenticate Salesforce Org
      # ======================
      - name: Authenticate Salesforce Org
        shell: powershell
        env:
          CONNECTED_APP_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
          SFDC_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_JWT_KEY_CONTENT: ${{ secrets.SF_JWT_KEY }}
        run: |
          $keyPath = "$env:GITHUB_WORKSPACE\jwt.key"
          Write-Host "Writing JWT key file..."
          [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($env:SF_JWT_KEY_CONTENT)) | Out-File -FilePath $keyPath -Encoding UTF8

          sf org login jwt `
            --client-id $env:CONNECTED_APP_CONSUMER_KEY `
            --jwt-key-file $keyPath `
            --username $env:SFDC_USERNAME `
            --alias $env:ORG_ALIAS `
            --instance-url $env:SFDC_HOST

      # ======================
      # 4. Identify Changed Components
      # ======================
      - name: Identify Changed Components
        id: find_changes
        shell: powershell
        run: |
          Write-Host "Detecting changed Salesforce metadata files..."

          $commitCount = (git rev-list --count HEAD)
          if ($commitCount -gt 1) {
              $changedFiles = git diff --name-only HEAD~1 HEAD
          } else {
              Write-Host "Initial commit detected. Using all files."
              $changedFiles = git ls-files 'force-app/*'
          }

          if (-not $changedFiles) {
              Write-Host "No changes detected. Skipping deployment."
              echo "CHANGED_DIR=none" >> $env:GITHUB_ENV
              exit 0
          }

          Write-Host "`Changed Files in Commit:`n"
          $changedFiles | ForEach-Object { Write-Host " - $_" }

          $metadataFiles = $changedFiles | Where-Object {
            ($_ -like 'force-app/*') -and
            ($_ -match '\.(cls|xml|trigger|page|component|js|html|cmp|css|object|field|profile|permissionset|tab|layout)$')
          }

          if (-not $metadataFiles) {
              Write-Host "No deployable metadata found."
              echo "CHANGED_DIR=none" >> $env:GITHUB_ENV
              exit 0
          }

          $deployDir = "changed-deploy/force-app/main/default"
          if (Test-Path "changed-deploy") { Remove-Item -Recurse -Force "changed-deploy" }
          New-Item -ItemType Directory -Path $deployDir -Force | Out-Null

          foreach ($file in $metadataFiles) {
              $dest = Join-Path "changed-deploy" $file
              $destDir = Split-Path $dest
              if (-not (Test-Path $destDir)) { New-Item -ItemType Directory -Path $destDir -Force | Out-Null }
              Copy-Item $file $dest -Force
          }

          Write-Host "`nCopied changed metadata files to changed-deploy folder."
          echo "CHANGED_DIR=changed-deploy/force-app/main/default" >> $env:GITHUB_ENV

      # ======================
      # 5. Preview Deployment Changes
      # ======================
      - name: Preview Deployment Changes
        if: env.CHANGED_DIR != 'none' && env.CHANGED_DIR != ''
        shell: powershell
        run: |
          Write-Host "Previewing deployment changes..."
          Write-Host "`nFiles that will be deployed:`n"
          Get-ChildItem -Recurse $env:CHANGED_DIR | ForEach-Object { Write-Host " - $($_.FullName)" }

          $orgInfo = sf org display --target-org $env:ORG_ALIAS --json | ConvertFrom-Json
          if ($orgInfo.result.isScratchOrg -eq $true) {
              Write-Host "`nRunning source-tracked preview..."
              sf project deploy preview --source-dir "$env:CHANGED_DIR" --target-org $env:ORG_ALIAS
          } else {
              Write-Host "`nOrg is not source-tracked (Sandbox/Prod). Skipping preview step."
          }

      # ======================
      # 6. Deploy Changed Components
      # ======================
      - name: Deploy Changed Salesforce Components
        if: env.CHANGED_DIR != 'none' && env.CHANGED_DIR != ''
        shell: powershell
        run: |
          Write-Host "Deploying changed metadata to Salesforce..."
          $deployResult = sf project deploy start --target-org $env:ORG_ALIAS --source-dir "$env:CHANGED_DIR" --wait 15 --json
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Deployment failed. See logs above."
              exit 1
          }
          Write-Host "Deployment completed successfully."

      # ======================
      # 7. Run Apex Unit Tests
      # ======================
      - name: Run Apex Tests
        if: env.CHANGED_DIR != 'none'
        shell: powershell
        run: |
          Write-Host "Running Apex Unit Tests..."
          sf apex run test --target-org $env:ORG_ALIAS --result-format junit --output-dir test-results --wait 10

      - name: Upload Test Results
        if: env.CHANGED_DIR != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: Apex-Test-Results
          path: test-results/**/*.xml

      # ======================
      # 8. Cleanup
      # ======================
      - name: Cleanup Workspace
        shell: powershell
        run: |
          Write-Host "Cleaning up workspace..."
          Remove-Item -Recurse -Force "changed-deploy" -ErrorAction SilentlyContinue
          Remove-Item "$env:GITHUB_WORKSPACE\jwt.key" -ErrorAction SilentlyContinue
