name: Salesforce CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - githubcicd
      - feature/**

jobs:
  salesforce-deploy:
    name: Salesforce CI/CD
    runs-on: self-hosted  # Windows self-hosted runner
    env:
      SFDC_HOST: "https://login.salesforce.com"
      ORG_ALIAS: "projectdemosfdc"
      NEXUS_URL: "http://localhost:8081/repository/StaticCodeAnalysisReports"

    steps:
      # ======================
      # 1. Checkout Repository
      # ======================
      - name: Checkout Source
        uses: actions/checkout@v4

      # ======================
      # 2. Ensure Git is Installed
      # ======================
      - name: Verify or Install Git
        shell: powershell
        run: |
          Write-Host "Verifying Git installation..."
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) {
              Write-Host "Git not found. Installing via winget..."
              try {
                  winget install --id Git.Git -e --source winget --accept-source-agreements --accept-package-agreements
                  $gitPath = "C:\Program Files\Git\cmd"
                  if (Test-Path $gitPath) {
                      Write-Host "Adding Git to PATH..."
                      echo "PATH=$gitPath;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                  } else {
                      Write-Error "Git installation failed. Please verify runner permissions."
                      exit 1
                  }
              } catch {
                  Write-Error "Git installation failed: $($_.Exception.Message)"
                  exit 1
              }
          } else {
              Write-Host "✅ Git is already installed."
          }

      # ======================
      # 3. Cache Salesforce CLI
      # ======================
      - name: Cache Salesforce CLI
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Roaming\npm
          key: ${{ runner.os }}-sfdx-cli

      # ======================
      # 4. Install Salesforce CLI & Plugins
      # ======================
      - name: Install Salesforce CLI and Scanner
        shell: powershell
        run: |
          Write-Host "Installing Salesforce CLI and Scanner Plugin..."
          if (-not (Get-Command npm -ErrorAction SilentlyContinue)) {
              Write-Error "npm is not installed. Install Node.js first."
              exit 1
          }

          if (-not (Get-Command sf -ErrorAction SilentlyContinue)) {
              Write-Host "Installing Salesforce CLI..."
              npm install --global @salesforce/cli@latest
              $npmGlobalPath = (npm root -g).Replace('node_modules', '')
              echo "PATH=$npmGlobalPath;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
              Write-Host "Salesforce CLI already installed."
          }

          Write-Host "Installing/updating Scanner plugin..."
          try { sf plugins install @salesforce/sfdx-scanner@latest } catch { Write-Host "Plugin already installed." }

      # ======================
      # 5. Static Code Analysis
      # ======================
      - name: Run Salesforce Code Analyzer
        id: sca
        shell: powershell
        run: |
          Write-Host "Running Static Code Analysis..."
          $dateStamp = Get-Date -Format "ddMMyy"
          $buildNumber = $env:GITHUB_RUN_NUMBER
          $htmlDir = "html-report"
          $htmlReport = "CodeAnalyzerReport_${dateStamp}_${buildNumber}.html"
          if (Test-Path $htmlDir) { Remove-Item -Recurse -Force $htmlDir }
          New-Item -ItemType Directory -Path $htmlDir | Out-Null
          sf code-analyzer run --workspace force-app --rule-selector Recommended --output-file "$htmlDir\$htmlReport"
          echo "report=$htmlReport" >> $env:GITHUB_OUTPUT

      # ======================
      # 6. Upload SCA Report to Nexus
      # ======================
      - name: Upload SCA Report to Nexus
        shell: powershell
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
        run: |
          $projectName = "SF-CICD-POC"
          $branchName  = $env:GITHUB_REF_NAME -replace '[^\w\-.]', '_'
          $buildNumber = $env:GITHUB_RUN_NUMBER
          $htmlReport = "${{ steps.sca.outputs.report }}"
          $nexusPath = "$projectName/$branchName/$buildNumber"
          $url = "$env:NEXUS_URL/$nexusPath/$htmlReport"
          $filePath = "html-report\$htmlReport"
          $base64Auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$env:NEXUS_USER`:$env:NEXUS_PASS"))
          Invoke-WebRequest -Uri $url -Method Put -InFile $filePath -Headers @{Authorization = "Basic $base64Auth"} -UseBasicParsing
          Write-Host "✅ Uploaded report to Nexus at ${url}"

      # ======================
      # 7. Pre-Check Salesforce Credentials
      # ======================
      - name: Pre-Check Salesforce Credentials
        shell: powershell
        env:
          CONNECTED_APP_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
          SFDC_USERNAME: ${{ secrets.SF_USERNAME }}
          JWT_KEY_FILE: ${{ secrets.SF_JWT_KEY_PATH }}
        run: |
          Write-Host "Validating Salesforce Credentials..."
          if (-not $env:CONNECTED_APP_CONSUMER_KEY) { Write-Error "Missing CONNECTED_APP_CONSUMER_KEY"; exit 1 }
          if (-not $env:SFDC_USERNAME) { Write-Error "Missing SFDC_USERNAME"; exit 1 }
          if (-not $env:JWT_KEY_FILE) { Write-Error "Missing JWT_KEY_FILE environment variable"; exit 1 }
          if (-not (Test-Path $env:JWT_KEY_FILE)) { Write-Error "JWT_KEY_FILE path does not exist"; exit 1 }
          Write-Host "✅ Pre-check passed."

      # ======================
      # 8. Authenticate Salesforce Org
      # ======================
      - name: Authenticate Salesforce Org
        shell: powershell
        env:
          CONNECTED_APP_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
          SFDC_USERNAME: ${{ secrets.SF_USERNAME }}
          JWT_KEY_FILE: ${{ secrets.SF_JWT_KEY_PATH }}
        run: |
          Write-Host "Authenticating to Salesforce Org..."
          sf org login jwt `
            --client-id $env:CONNECTED_APP_CONSUMER_KEY `
            --jwt-key-file $env:JWT_KEY_FILE `
            --username $env:SFDC_USERNAME `
            --alias $env:ORG_ALIAS `
            --instance-url $env:SFDC_HOST

      # ======================
      # 9. Identify changed components
      # ======================
      - name: Identify changed Salesforce components
        shell: powershell
        run: |
          Write-Host "Identifying changed Salesforce components..."
          git fetch origin main
          $changedFiles = git diff --name-only origin/main...HEAD
          if (-not $changedFiles) { Write-Host "No changes detected."; echo "CHANGED_DIR=none" >> $env:GITHUB_ENV; exit 0 }
          $metadataFiles = $changedFiles | Where-Object { $_ -like "force-app/*" }
          if (-not $metadataFiles) { Write-Host "No Salesforce metadata changes."; echo "CHANGED_DIR=none" >> $env:GITHUB_ENV; exit 0 }

          $tempDeployDir = "changed-deploy"
          if (Test-Path $tempDeployDir) { Remove-Item -Recurse -Force $tempDeployDir }
          New-Item -ItemType Directory -Path $tempDeployDir | Out-Null
          foreach ($file in $metadataFiles) {
              $dest = Join-Path $tempDeployDir $file
              $destDir = Split-Path $dest
              if (-not (Test-Path $destDir)) { New-Item -ItemType Directory -Path $destDir | Out-Null }
              Copy-Item $file $dest
          }
          Write-Host "✅ Changed components copied to $tempDeployDir"
          echo "CHANGED_DIR=$tempDeployDir" >> $env:GITHUB_ENV

      # ======================
      # 10. Deploy changed components (conditional)
      # ======================
      - name: Deploy changed Salesforce components
        if: env.CHANGED_DIR != 'none'
        shell: powershell
        run: |
          Write-Host "Deploying only changed components..."
          sf project deploy start --target-org $env:ORG_ALIAS --source-dir $env:CHANGED_DIR --wait 10

      # ======================
      # 11. Run Apex Tests (conditional)
      # ======================
      - name: Run Apex Unit Tests
        if: env.CHANGED_DIR != 'none'
        shell: powershell
        run: |
          Write-Host "Running Apex Unit Tests..."
          New-Item -ItemType Directory -Path "test-results" -Force | Out-Null
          sf apex run test --target-org $env:ORG_ALIAS --result-format junit --output-dir test-results --wait 10

      - name: Publish Apex Test Results
        if: env.CHANGED_DIR != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: Apex-Test-Results
          path: test-results/**/*.xml

      # ======================
      # 12. Cleanup
      # ======================
      - name: Cleanup Workspace
        shell: powershell
        run: |
          Write-Host "Cleaning workspace..."
          Remove-Item -Recurse -Force * -ErrorAction SilentlyContinue
          Write-Host "✅ Workspace cleaned successfully!"
